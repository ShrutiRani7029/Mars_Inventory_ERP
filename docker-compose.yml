# Local stack: Postgres + Redis + api + worker + mock channels/ERP.
#   docker compose up --build
#   open http://localhost:3000/ops
#   docker compose exec api node dist/scripts/simulate-sale.js --orders 1200 --per-minute 300 --erp-down 90
x-env: &env
  DATABASE_URL: postgres://mars:mars@postgres:5432/mars
  REDIS_URL: redis://redis:6379
  MOCK_BASE_URL: http://mock:4000
  API_BASE_URL: http://api:3000

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mars, POSTGRES_PASSWORD: mars, POSTGRES_DB: mars }
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Applies migrations, then (unless SEED=false) loads 1,200 demo SKUs. Seeding WIPES data.
  migrate:
    build: ./service
    environment: { <<: *env, SEED: "${SEED:-true}" }
    command: sh -c 'node dist/scripts/migrate.js && if [ "$$SEED" != "false" ]; then node dist/scripts/seed.js; fi'
    depends_on:
      postgres: { condition: service_healthy }

  mock:
    build: ./service
    environment: *env
    command: node dist/mock/mock-channels.js
    ports: ["4000:4000"]

  api:
    build: ./service
    environment: *env
    command: node dist/main-api.js
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: ./service
    environment: *env
    command: node dist/main-worker.js
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      mock: { condition: service_started }
